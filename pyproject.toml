[project]
name = "hiplot"
version = "1.0.0"
description = "Drive a Houston Instrument Omnigraphic 2000 X-Y recorder as a pen plotter"
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.67.0",
  "pillow>=13.0.0",
  "pyserial>=3.5",
  "scikit-image>=0.26.0",
  "vpype>=1.14",
]

[project.scripts]
plot = "hiplot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/hiplot"]

[tool.pytest.ini_options]
testpaths = ["host/tests"]
